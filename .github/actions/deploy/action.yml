name: "Deploy Application"
description: "Builds, packages, and deploys WWB Docker container to VM over Tailscale and SSH"

inputs:
  tag:
    description: "Target container image tag"
    required: true
  github-token:
    description: "GitHub token for GHCR authentication"
    required: false
    default: ${{ github.token }}
  push-latest:
    description: "Whether to tag and push :latest image"
    required: false
    default: "false"
  app-env:
    description: "APP_ENV variable"
    required: true
  backend-port:
    description: "BACKEND_PORT variable"
    required: true
  ip-salt:
    description: "IP_SALT secret"
    required: true
  db-path:
    description: "DB_PATH variable"
    required: true
  allowed-hosts:
    description: "ALLOWED_HOSTS variable"
    required: true
  retention-limit:
    description: "RETENTION_LIMIT variable"
    required: true
  ssh-host:
    description: "SSH target host"
    required: true
  ssh-user:
    description: "SSH user"
    required: true
  ssh-private-key:
    description: "SSH private key secret"
    required: true
  ssh-passphrase:
    description: "SSH key passphrase secret"
    required: false
    default: ""
  deploy-path:
    description: "Remote deployment path"
    required: true
  container-name:
    description: "Docker container name"
    required: false
    default: "world-wide-bulb"
  ts-oauth-client-id:
    description: "Tailscale OAuth Client ID secret"
    required: true
  ts-oauth-secret:
    description: "Tailscale OAuth Secret"
    required: true
  turnstile-site-key:
    description: "Cloudflare Turnstile Site Key secret"
    required: false
    default: ""
  turnstile-secret:
    description: "Cloudflare Turnstile Secret secret"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Frontend Environment
      uses: ./.github/actions/setup-frontend

    - name: Setup Backend Environment
      uses: ./.github/actions/setup-backend

    - name: Setup Just runner
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

    - name: Build Single Binary with Embedded Svelte
      shell: bash
      run: |
        just build-prod
        cp bin/wwb bin/wwb-bin

    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Lowercase repo name
      id: prep
      shell: bash
      run: |
        echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

    - name: Build and push container
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ inputs.tag }}
          ghcr.io/${{ steps.prep.outputs.repo_lower }}:sha-${{ github.sha }}
          ${{ inputs.push-latest == 'true' && format('ghcr.io/{0}:latest', steps.prep.outputs.repo_lower) || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Connect to Tailscale
      uses: tailscale/github-action@6cae46e2d796f265265cfcf628b72a32b4d7cade # v3.3.0
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci

    - name: Generate deployment .env
      shell: bash
      env:
        APP_ENV: ${{ inputs.app-env }}
        BACKEND_PORT: ${{ inputs.backend-port }}
        IP_SALT: ${{ inputs.ip-salt }}
        DB_PATH: ${{ inputs.db-path }}
        ALLOWED_HOSTS: ${{ inputs.allowed-hosts }}
        RETENTION_LIMIT: ${{ inputs.retention-limit }}
        TAG: ${{ inputs.tag }}
        CONTAINER_NAME: ${{ inputs.container-name }}
        TURNSTILE_SITE_KEY: ${{ inputs.turnstile-site-key }}
        TURNSTILE_SECRET: ${{ inputs.turnstile-secret }}
      run: |
        cat <<EOF > .env
        APP_ENV=${APP_ENV}
        BACKEND_PORT=${BACKEND_PORT}
        IP_SALT=${IP_SALT}
        DB_PATH=${DB_PATH}
        ALLOWED_HOSTS=${ALLOWED_HOSTS}
        RETENTION_LIMIT=${RETENTION_LIMIT}
        TAG=${TAG}
        CONTAINER_NAME=${CONTAINER_NAME}
        TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
        TURNSTILE_SECRET=${TURNSTILE_SECRET}
        EOF

    - name: Copy deployment files
      uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
      with:
        host: ${{ inputs.ssh-host }}
        username: ${{ inputs.ssh-user }}
        key: ${{ inputs.ssh-private-key }}
        passphrase: ${{ inputs.ssh-passphrase }}
        source: "docker-compose.yaml,.env"
        target: ${{ inputs.deploy-path }}

    - name: Deploy to VM
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      with:
        host: ${{ inputs.ssh-host }}
        username: ${{ inputs.ssh-user }}
        key: ${{ inputs.ssh-private-key }}
        passphrase: ${{ inputs.ssh-passphrase }}
        script: |
          bash -c '
          mkdir -p ${{ inputs.deploy-path }}
          cd ${{ inputs.deploy-path }}
          docker compose pull
          docker compose up -d
          sleep 3
          if ! docker compose ps wwb --format "{{.State}}" | grep -iq "running"; then
            echo "::error::Container failed to start or crashed!"
            docker compose logs --tail=50
            exit 1
          fi
          docker image prune -f
          '
