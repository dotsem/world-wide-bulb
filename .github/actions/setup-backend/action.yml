name: "Setup Backend"
description: "Configures Go environment, caching, and downloads module dependencies"

inputs:
  work-dir:
    description: "Backend working directory"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.work-dir }}/go.mod
        cache: true
        cache-dependency-path: ${{ inputs.work-dir }}/go.sum

    - name: Ensure dependencies
      working-directory: ${{ inputs.work-dir }}
      shell: bash
      run: go mod download
