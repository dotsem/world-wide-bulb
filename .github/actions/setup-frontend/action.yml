name: "Setup Frontend"
description: "Installs pnpm, configures Node.js caching, and installs frontend dependencies"

inputs:
  work-dir:
    description: "Frontend working directory"
    required: false
    default: "web"
  node-version:
    description: "Node.js version to configure"
    required: false
    default: "22.x"
  install-deps:
    description: "Whether to run pnpm install"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.install-deps == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.work-dir }}/pnpm-lock.yaml

    - name: Install dependencies
      if: inputs.install-deps == 'true'
      working-directory: ${{ inputs.work-dir }}
      shell: bash
      run: pnpm install --frozen-lockfile
