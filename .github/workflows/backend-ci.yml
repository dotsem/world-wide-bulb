name: Backend CI

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!web/**"
      - "!.github/workflows/frontend-ci.yml"
      - "!**.md"
  pull_request:
    branches: ["**"]
    paths:
      - "**"
      - "!web/**"
      - "!.github/workflows/frontend-ci.yml"
      - "!**.md"

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.auto_commit.outputs.commit_hash }}
      changes_detected: ${{ steps.auto_commit.outputs.changes_detected }}
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check formatting (gofmt)
        run: gofmt -l -w -s .

      - name: Commit Changes
        id: auto_commit
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: fix gofmt errors"

      - name: Cache golangci-lint binary
        id: cache-golangci-lint
        uses: actions/cache@v4
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v2-${{ matrix.go-version }}

      - name: Install golangci-lint v2
        if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: |
          # The binary is installed to GOPATH/bin
          $(go env GOPATH)/bin/golangci-lint run --config=.golangci.yml

      - name: Mark formatting commit as green
        if: steps.auto_commit.outputs.changes_detected == 'true'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ steps.auto_commit.outputs.commit_hash }} \
            -d '{"state":"success", "target_url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}", "description":"gofmt auto-formatting applied", "context":"Static Code Analysis"}'

  test:
    name: Build & Test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache gotestsum binary
        id: cache-gotestsum
        uses: actions/cache@v4
        with:
          path: ~/go/bin/gotestsum
          key: ${{ runner.os }}-gotestsum-${{ matrix.go-version }}

      - name: Install gotestsum
        if: steps.cache-gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests with coverage
        run: |
          # Run tests with gotestsum for a clear overview of failures in CI logs
          $(go env GOPATH)/bin/gotestsum --format pkgname-and-test-fails --junitfile unit-tests.xml -- -race ./... -coverprofile=coverage.out -covermode=atomic
          grep -v -E "internal/store/(db|models|.*\.sql)\.go" coverage.out > coverage_clean.out
          mv coverage_clean.out coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.out

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./unit-tests.xml

      # --- Test & Coverage Analysis ---
      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true
        with:
          config: ./.github/.testcoverage.yml

      - name: Generate Detailed Coverage Report
        id: detailed_report
        if: always()
        run: |
          REPORT=$(./scripts/github/coverage_report.sh coverage.out)
          echo "table<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Pull Request Interaction ---
      - name: find pull request ID
        id: find_pr
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          EXISTING_PR: ${{ github.event.pull_request.number }}
        run: |
          PR_ID=$(./scripts/github/find_pr.sh \
            "$REPO" \
            "$OWNER" \
            "$BRANCH" \
            "$GITHUB_TOKEN" \
            "$EXISTING_PR")

          if [ -n "$PR_ID" ]; then
            echo "pull_request_id=$PR_ID" >> $GITHUB_OUTPUT
          fi

      - name: post coverage report
        if: always() && steps.find_pr.outputs.pull_request_id
        uses: thollander/actions-comment-pull-request@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          pr-number: ${{ steps.find_pr.outputs.pull_request_id }}
          message: |
            ### Test Coverage Report

            ${{ steps.coverage.outputs.report && fromJSON(steps.coverage.outputs.report) || 'No coverage report available' }}

            <details>
            <summary>View Detailed Package Coverage</summary>

            ${{ steps.detailed_report.outputs.table }}

            </details>

      # --- Verification & Cleanup ---
      - name: "finally check coverage"
        if: always() && steps.coverage.outcome == 'failure'
        shell: bash
        run: |
          echo "### ❌ Coverage Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "Test coverage does not meet the required thresholds. Check the PR comment for details." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Final Status
        if: failure() && steps.coverage.outcome != 'failure'
        run: |
          echo "### ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Backend CI failed. Review the logs above to see test/lint failures." >> $GITHUB_STEP_SUMMARY

      - name: Post test status to formatting commit
        if: always() && needs.lint.outputs.changes_detected == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
        run: |
          STATE="success"
          if [ "$JOB_STATUS" = "failure" ] || [ "$JOB_STATUS" = "cancelled" ] || [ "$COVERAGE_OUTCOME" = "failure" ]; then
            STATE="failure"
          fi
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ needs.lint.outputs.commit_hash }} \
            -d "{\"state\":\"$STATE\", \"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"description\":\"Unit tests and coverage validation\", \"context\":\"Build & Test\"}"
