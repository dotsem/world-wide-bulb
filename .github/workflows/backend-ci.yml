name: Backend CI

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!web/**"
      - "!.github/workflows/frontend-ci.yml"
      - "!**.md"
  pull_request:
    branches: ["**"]
    paths:
      - "**"
      - "!web/**"
      - "!.github/workflows/frontend-ci.yml"
      - "!**.md"

jobs:
  lint:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check formatting (gofmt)
        run: just go fmt-check

      - name: Cache golangci-lint binary
        id: cache-golangci-lint
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v2-${{ matrix.go-version }}

      - name: Install golangci-lint v2
        if: steps.cache-golangci-lint.outputs.cache-hit != 'true'
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: just go lint

  test:
    name: Build & Test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend
        with:
          go-version: ${{ matrix.go-version }}

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Cache gotestsum binary
        id: cache-gotestsum
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/bin/gotestsum
          key: ${{ runner.os }}-gotestsum-${{ matrix.go-version }}

      - name: Install gotestsum
        if: steps.cache-gotestsum.outputs.cache-hit != 'true'
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests with coverage
        run: just go test-ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.out
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage-report
          path: coverage.out

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: ./unit-tests.xml

      # --- Test & Coverage Analysis ---
      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@6890500b00a7e5862e54662c04ea9fa7c799ce1e # v2.23.0
        continue-on-error: true
        with:
          config: ./.github/.testcoverage.yml

      - name: Generate Detailed Coverage Report
        id: detailed_report
        if: always()
        run: |
          REPORT=$(./scripts/github/coverage_report.sh coverage.out)
          echo "table<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Pull Request Interaction ---
      - name: find pull request ID
        id: find_pr
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
          EXISTING_PR: ${{ github.event.pull_request.number }}
        run: |
          PR_ID=$(./scripts/github/find_pr.sh \
            "$REPO" \
            "$OWNER" \
            "$BRANCH" \
            "$GITHUB_TOKEN" \
            "$EXISTING_PR")

          if [ -n "$PR_ID" ]; then
            echo "pull_request_id=$PR_ID" >> $GITHUB_OUTPUT
          fi

      - name: post coverage report
        if: always() && steps.find_pr.outputs.pull_request_id
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-tag: coverage-report
          pr-number: ${{ steps.find_pr.outputs.pull_request_id }}
          message: |
            ### Test Coverage Report

            ${{ steps.coverage.outputs.report && fromJSON(steps.coverage.outputs.report) || 'No coverage report available' }}

            <details>
            <summary>View Detailed Package Coverage</summary>

            ${{ steps.detailed_report.outputs.table }}

            </details>

      # --- Verification & Cleanup ---
      - name: "finally check coverage"
        if: always() && steps.coverage.outcome == 'failure'
        shell: bash
        run: |
          echo "### ❌ Coverage Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "Test coverage does not meet the required thresholds. Check the PR comment for details." >> $GITHUB_STEP_SUMMARY
          exit 1

      - name: Final Status
        if: failure() && steps.coverage.outcome != 'failure'
        run: |
          echo "### ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Backend CI failed. Review the logs above to see test/lint failures." >> $GITHUB_STEP_SUMMARY
