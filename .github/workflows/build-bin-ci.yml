name: Build Single Binary CI

permissions:
  contents: read
  packages: write

concurrency:
  group: build-bin-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!**.md"
  pull_request:
    branches: ["**"]
    paths:
      - "**"
      - "!**.md"
  workflow_dispatch:

jobs:
  verify-build:
    name: Verify Single Binary Build & Push Staging Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend

      - name: Setup Just runner
        uses: extractions/setup-just@v2

      - name: Build Single Binary with Embedded Svelte
        run: |
          just web build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/wwb ./cmd/wwb

      - name: Verify Binary Output & Execution
        run: |
          test -f bin/wwb
          test -x bin/wwb
          echo "Single binary build verified successfully."

      - name: Set up QEMU
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        id: prep
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push staging container
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:staging
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:sha-${{ github.sha }}
