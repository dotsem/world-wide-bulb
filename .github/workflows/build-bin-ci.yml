name: Build Single Binary CI

permissions:
  contents: read

concurrency:
  group: build-bin-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!**.md"
  pull_request:
    branches: ["**"]
    paths:
      - "**"
      - "!**.md"
  workflow_dispatch:

jobs:
  verify-build:
    name: Verify Single Binary Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build Single Binary with Embedded Svelte
        run: just build-prod

      - name: Verify Binary Output & Execution
        run: |
          test -f bin/wwb
          test -x bin/wwb
          echo "Single binary build verified successfully."
