name: CD

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Target tag/version to deploy (e.g., v0.3.2). Defaults to 'latest' if left blank on branch runs."
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend

      - name: Setup Just runner
        uses: extractions/setup-just@v2

      - name: Build Single Binary with Embedded Svelte
        run: |
          just web build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/wwb ./cmd/wwb

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name and sanitize tag
        id: prep
        env:
          RAW_INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          if [ -n "$RAW_INPUT_TAG" ]; then
            TAG="${RAW_INPUT_TAG//\//-}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME//\//-}"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ steps.prep.outputs.tag }}
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Generate deployment .env
        env:
          APP_ENV: ${{ vars.APP_ENV }}
          BACKEND_PORT: ${{ vars.BACKEND_PORT }}
          IP_SALT: ${{ secrets.IP_SALT }}
          DB_PATH: ${{ vars.DB_PATH }}
          ALLOWED_HOSTS: ${{ vars.ALLOWED_HOSTS }}
          RETENTION_LIMIT: ${{ vars.RETENTION_LIMIT }}
        run: |
          cat <<EOF > .env
          APP_ENV=${APP_ENV}
          BACKEND_PORT=${BACKEND_PORT}
          IP_SALT=${IP_SALT}
          DB_PATH=${DB_PATH}
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          RETENTION_LIMIT=${RETENTION_LIMIT}
          TAG=${{ steps.prep.outputs.tag }}
          EOF

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.yaml,.env"
          target: ${{ vars.DEPLOY_PATH }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            mkdir -p ${{ vars.DEPLOY_PATH }}
            cd ${{ vars.DEPLOY_PATH }}
            docker compose pull
            docker compose up -d
