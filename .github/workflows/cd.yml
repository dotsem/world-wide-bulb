name: CD

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Target tag/version to deploy (e.g., v0.3.2). Defaults to 'latest' if left blank on branch runs."
        required: false
        default: ""

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend

      - name: Setup Just runner
        uses: extractions/setup-just@v2

      - name: Build Single Binary with Embedded Svelte
        run: |
          just build-prod
          cp bin/wwb bin/wwb-bin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name and sanitize tag
        id: prep
        env:
          RAW_INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
          if [ -n "$RAW_INPUT_TAG" ]; then
            TAG="${RAW_INPUT_TAG//\//-}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME//\//-}"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Upload Binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          files: bin/wwb-bin

      - name: Build and push container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ steps.prep.outputs.tag }}
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:sha-${{ github.sha }}
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest

      - name: Deploy to VM
        uses: ./.github/actions/deploy
        with:
          tag: ${{ steps.prep.outputs.tag }}
          app-env: ${{ vars.APP_ENV }}
          backend-port: ${{ vars.BACKEND_PORT }}
          ip-salt: ${{ secrets.IP_SALT }}
          db-path: ${{ vars.DB_PATH }}
          allowed-hosts: ${{ vars.ALLOWED_HOSTS }}
          retention-limit: ${{ vars.RETENTION_LIMIT }}
          ssh-host: ${{ vars.SSH_HOST }}
          ssh-user: ${{ vars.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-passphrase: ${{ secrets.SSH_PASSPHRASE }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
