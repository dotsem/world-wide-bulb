name: Documentation CI

permissions:
  contents: read

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - "justfile"
      - "just/**"
      - "cmd/docgen/**"
      - "README.md"
      - "GUIDELINES.md"
      - ".github/workflows/docs-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "justfile"
      - "just/**"
      - "cmd/docgen/**"
      - "README.md"
      - "GUIDELINES.md"
      - ".github/workflows/docs-ci.yml"

jobs:
  check-docs:
    name: Verify Documentation Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Backend Environment
        uses: dotactions/go/setup@1a6ae9ba565a8bd6282357d036122ca023631198 # v0.1.1

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Verify Documentation Sync
        run: just check-docs
