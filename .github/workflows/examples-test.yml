name: Examples Test

permissions:
    contents: read

concurrency:
    group: examples-test-${{ github.ref }}
    cancel-in-progress: true

on:
    push:
        branches: ["main"]
        paths:
            - "**"
            - "!web/**"
            - "!.github/workflows/frontend-ci.yml"
            - "!**.md"
    pull_request:
        branches: ["**"]
        paths:
            - "**"
            - "!web/**"
            - "!.github/workflows/frontend-ci.yml"
            - "!**.md"

jobs:
    test:
        name: Test Doc Code Examples
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Backend Environment
              uses: ./.github/actions/setup-backend

            - name: Setup Just runner
              uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

            # Setup all code example toolchains
            # Update when new toolchain is used!

            - name: Setup Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "22"

            - name: Setup Go
              working-directory: examples/sse/go
              run: go mod download

            - name: Test examples
              run: just go test-examples
