name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "just/web.just"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
      - "!**.md"
  pull_request:
    branches: ["**"]
    paths:
      - "web/**"
      - "just/web.just"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
      - "!**.md"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@v2

      - name: Run ESLint
        run: just web lint

      - name: Run Prettier check
        run: just web fmt-check

      - name: Run Svelte type check
        run: just web check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@v2

      - name: Build frontend
        run: just web build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web/build/
          retention-days: 7

  unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@v2

      - name: Run vitest unit tests
        run: just web test-unit

  e2e-tests:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@v2

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: just web playwright-install

      - name: E2E Tests (Playwright)
        run: just web test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
