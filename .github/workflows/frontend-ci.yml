name: Frontend CI

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "just/web.just"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
      - "!**.md"
  pull_request:
    branches: ["**"]
    paths:
      - "web/**"
      - "just/web.just"
      - ".github/workflows/frontend-ci.yml"
      - ".github/actions/setup-frontend/**"
      - "!**.md"

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run ESLint
        run: just web lint

      - name: Run Prettier check
        run: just web fmt-check

      - name: Run Svelte type check
        run: just web check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build frontend
        run: just web build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: web/build/
          retention-days: 7

  unit-tests:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run vitest unit tests
        run: just web test-unit

  e2e-tests:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: just web playwright-install

      - name: E2E Tests (Playwright)
        run: just web test-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
