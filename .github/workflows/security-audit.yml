name: Security Audit

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: &paths
      - "web/pnpm-lock.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: ["**"]
    paths: *paths

permissions:
  contents: read

jobs:
  trivy:
    permissions: { contents: read, pull-requests: write, issues: write }
    uses: dotactions/security/.github/workflows/trivy-audit.yml@4d0356342b83c1c83c8e6ac5496589ba8fa665c2 # v0.1.0
    with:
      severity: "CRITICAL,HIGH"
      fail-on-findings: ${{ github.event_name == 'pull_request' }}
      manage-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  go-audit:
    name: Go Dependency Audit
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, issues: write }
    steps:
      - name: Run Go Vulnerability Check
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: .
          go-version-input: ""
          go-version-file: go.mod
          output-format: sarif
          output-file: govulncheck.sarif

      - name: Drop unreachable findings
        if: always() && hashFiles('govulncheck.sarif') != ''
        run: |
          jq '(.runs[].results) |= map(select(.level != "note"))' govulncheck.sarif > filtered.sarif
          mv filtered.sarif govulncheck.sarif

      - uses: dotactions/sarif-reporter@917c66712f17657e67d429895eade83a9543034d # v0.1.0
        if: always() && hashFiles('govulncheck.sarif') != ''
        with:
          sarif-file: govulncheck.sarif
          comment-tag: govulncheck
          title: Go Vulnerability Report
          issue-title: "[Security Audit] Go vulnerabilities detected"
          fail-on-findings: ${{ github.event_name == 'pull_request' }}
          manage-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  image-audit:
    name: Container Image Audit
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write, issues: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-frontend

      - uses: ./.github/actions/setup-backend

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build binary
        run: just build-prod

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          pull: true
          no-cache: true
          tags: wwb:audit

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: wwb:audit
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"
          limit-severities-for-sarif: true

      - uses: dotactions/sarif-reporter@917c66712f17657e67d429895eade83a9543034d # v0.1.0
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif-file: trivy-image.sarif
          comment-tag: trivy-image
          title: Container Image Report
          issue-title: "[Security Audit] image vulnerabilities"
          fail-on-findings: ${{ github.event_name == 'pull_request' }}
          manage-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}