name: Security Audit

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "web/pnpm-lock.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "web/pnpm-lock.yaml"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read
  issues: write

jobs:
  frontend-audit:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Frontend Environment
        uses: ./.github/actions/setup-frontend
        with:
          install-deps: "false"

      - name: Setup Just runner
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run security audit
        run: just web audit


  backend-audit:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Backend Environment
        uses: ./.github/actions/setup-backend

      - name: Run Go Vulnerability Check
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [frontend-audit, backend-audit]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Set current date
        id: date
        run: echo "date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
      - name: Create or Comment on GitHub Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: "Security Audit Failure: Vulnerability Detected"
          ISSUE_BODY: |
            The scheduled security audit workflow failed. A dependency vulnerability may have been discovered in the frontend or backend.

            **Please review the run details:**
            - **Workflow Run Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Date:** ${{ steps.date.outputs.date }}

            Please investigate and update the vulnerable dependencies immediately.
          COMMENT_BODY: |
            The scheduled security audit failed again.

            **Workflow Run Logs:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Date:** ${{ steps.date.outputs.date }}
        run: |
          set -eo pipefail

          issue_number=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label "security" \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' \
            | head -n 1)

          if [ -n "$issue_number" ]; then
            echo "existing open issue found: #$issue_number. commenting instead of creating a new issue."
            gh issue comment "$issue_number" \
              --repo "${{ github.repository }}" \
              --body "$COMMENT_BODY"
          else
            echo "no existing open issue found. creating a new issue."
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --label "security"
          fi
