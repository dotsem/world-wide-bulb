name: Staging CD

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!**.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Target container image tag (defaults to 'staging')"
        required: false
        default: "staging"

concurrency:
  group: staging-cd
  cancel-in-progress: true

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Deploy to Staging VM
        uses: ./.github/actions/deploy
        with:
          tag: ${{ github.event.inputs.tag || 'staging' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-env: ${{ vars.APP_ENV }}
          backend-port: ${{ vars.BACKEND_PORT }}
          ip-salt: ${{ secrets.IP_SALT }}
          db-path: ${{ vars.DB_PATH }}
          allowed-hosts: ${{ vars.ALLOWED_HOSTS }}
          retention-limit: ${{ vars.RETENTION_LIMIT }}
          ssh-host: ${{ vars.SSH_HOST }}
          ssh-user: ${{ vars.SSH_USER }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-passphrase: ${{ secrets.SSH_PASSPHRASE }}
          deploy-path: ${{ vars.DEPLOY_PATH }}
          container-name: world-wide-bulb-staging
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
