pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      tags:
        - security
      skip:
        - run: "! command -v gitleaks >/dev/null 2>&1"
      run: gitleaks protect --verbose --staged

    - name: web
      tags:
        - web
      glob: "web/**/*.{js,ts,svelte,json,css,html,md}"
      group:
        parallel: false
        jobs:
          - name: format
            run: just web fmt
            stage_fixed: true
          - name: lint
            run: just web lint
          - name: check
            run: just web check

    - name: go
      tags:
        - backend
        - go
      glob: "**/*.go"
      group:
        parallel: false
        jobs:
          - name: format
            run: just go fmt
            stage_fixed: true
          - name: lint
            run: just go lint

    - name: docs
      tags:
        - docs
      glob: "{justfile,just/*.just,cmd/docgen/*.go}"
      run: just docgen
      stage_fixed: true
